services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perfectday
      POSTGRES_USER: perfectday
      POSTGRES_PASSWORD: perfectday_dev
    ports:
      - "5432:5432"
    volumes:
      - perfectday_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfectday -d perfectday"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  perfectday_pgdata:
