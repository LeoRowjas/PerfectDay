services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perfectday
      POSTGRES_USER: perfectday
      POSTGRES_PASSWORD: perfectday_dev
    ports:
      - "5432:5432"
    volumes:
      - perfectday_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfectday -d perfectday"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API в контейнере, чтобы для фронтенда не ставить .NET. Тот же адрес :5244, что и у dotnet run.
  api:
    build: ./PerfectDay_server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Development: миграции применяются при старте, берутся локальные ключи из appsettings.Development.json.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=perfectday;Username=perfectday;Password=perfectday_dev
    ports:
      - "5244:8080"

volumes:
  perfectday_pgdata:
